[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ariadne-core"
version = "0.1.0"
description = "Open source document extraction and retrieval pipeline"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "markitdown[all]>=0.1.0",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.5",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.1",
]

[project.scripts]
ariadne-core = "pipeline.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
