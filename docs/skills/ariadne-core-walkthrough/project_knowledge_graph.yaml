  # ========== ONBOARDING / EDUCATION ==========

  - id: nate_jones_video
    name: "Nate Jones: Your Claude Sessions Cost 10x What They Should"
    one_line: "The 12-minute video that frames the token-waste problem and gives us the 20x and 10x anchor numbers we use everywhere."
    body: |
      Nate Jones's video "Your Claude Sessions Cost 10x What They Should" is
      the source of the anchor numbers we use throughout the pricing and
      savings story. His core argument: users are burning frontier-rate tokens
      on tasks the frontier model shouldn't be doing — reading raw PDFs,
      figuring out extraction on the fly, maintaining long sessions that churn
      context. The fix is markdown-first workflows, fresh conversations, and
      model-appropriate routing. Ariadne Core is the infrastructure that
      makes the markdown-first part automatic. Use this video as the cold-open
      hook for any presenter session.
    see_also: [ten_x_session_savings, mechanism_1_raw_pdf_bloat, stupid_button_diagnostic, token_translator_prompt]
    sources:
      - file: docs/skills/ariadne-core-walkthrough/saving_tokens_transcript.txt
        section: "full transcript"
        github_url: https://github.com/denson/ariadne-core/blob/main/docs/skills/ariadne-core-walkthrough/saving_tokens_transcript.txt
      - url: https://natesnewsletter.substack.com/p/your-claude-sessions-cost-10x-what
    images: [video_thumbnail, roadmap_two_token_economies]

  - id: stupid_button_diagnostic
    name: "The Stupid Button diagnostic prompt"
    one_line: "A diagnostic prompt that rates a session 1–10 across six token-waste patterns — useful for showing a user where their own costs are leaking."
    body: |
      The "Stupid Button" prompt is a diagnostic: paste it into a session, and
      it rates that session 1–10 across six common token-waste patterns (raw
      PDFs in context, long-running conversations without refresh, re-reading
      the same docs, expensive-model-for-cheap-task, etc.). Useful when a user
      wants to understand where their own costs come from before buying into
      the fix. Pair with the Token Translator prompt for a fuller picture.
    see_also: [token_translator_prompt, nate_jones_video, ten_x_session_savings]
    sources:
      - file: docs/skills/ariadne-core-walkthrough/stupid_button_prompt.txt
        github_url: https://github.com/denson/ariadne-core/blob/main/docs/skills/ariadne-core-walkthrough/stupid_button_prompt.txt
    images: []

  - id: token_translator_prompt
    name: "The Token Translator prompt"
    one_line: "A prompt that reconstructs session token math phase-by-phase, so a user can see exactly where their money went."
    body: |
      The Token Translator prompt reconstructs a session's token math phase by
      phase: how much was spent reading raw documents, how much on re-reading,
      how much on the actual reasoning. It turns an opaque API bill into a
      line-item breakdown. Useful when a user is skeptical that raw-PDF
      overhead is as large as we claim — they can run the prompt on their own
      session and see for themselves.
    see_also: [stupid_button_diagnostic, nate_jones_video, anchor_numbers]
    sources:
      - file: docs/skills/ariadne-core-walkthrough/token_translator.txt
        github_url: https://github.com/denson/ariadne-core/blob/main/docs/skills/ariadne-core-walkthrough/token_translator.txt
    images: []

  - id: connect_claude_code
    name: "Connect Claude Code to Ariadne Core"
    one_line: "One `claude mcp add` command and you have six tools: convert_document, search, get_document, list_documents, list_collections, ingest."
    body: |
      Connecting Claude Code (or any MCP client) to a running Ariadne Core
      deployment is one command: `claude mcp add ariadne-core
      https://your-deployment.up.railway.app/mcp --transport http --scope
      user --header "X-API-Key:your-api-key"`. Restart Claude Code and six
      tools become available: `convert_document` (extract any file to
      Markdown), `search` (semantic search across stored docs), `get_document`
      (retrieve by ID), `list_documents`, `list_collections`, and `ingest`
      (batch-process a directory). The REST API is also available for scripts
      that don't speak MCP.
    see_also: [railway_deployment, search_dont_send, the_extraction_pipeline]
    sources:
      - file: README.md
        section: "MCP client connection"
        github_url: https://github.com/denson/ariadne-core/blob/main/README.md
      - file: docs/skills/ariadne-document-intelligence/SKILL.md
        github_url: https://github.com/denson/ariadne-core/blob/main/docs/skills/ariadne-document-intelligence/SKILL.md
