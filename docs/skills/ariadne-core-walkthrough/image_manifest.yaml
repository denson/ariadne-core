      Right "Railway Infrastructure — Passed Through at Cost": Postgres elephant "Own Postgres Instance", Weaviate hexagon "Weaviate Vector Search", hard-drive with meter "Storage — pay for what you use", swap-arrows "BYO models or buy from us."
