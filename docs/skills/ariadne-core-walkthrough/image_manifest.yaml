      Annotations: Month 4 bell "Alert: storage growing — here's your current Railway cost." Month 7 flag "Batch ingest spike — cost increase visible in dashboard." Month 9 receipt "Railway storage cost: transparent, billed at cost."
      Comparison box: "Managed user — Railway storage billed at cost. Most users see meaningful growth within 3-6 months. Storage alerts keep costs visible."
