  - id: scanned_pdf_limitations
    name: "Scanned PDFs and OCR (current limitation)"
    one_line: "MarkItDown can't do OCR — scanned PDFs with no text layer produce poor results. Suggest a separate OCR workflow for now; enhanced extraction is on the roadmap for Managed/Team."
    body: |
      **Scanned PDFs are a known Phase 1 limitation.** MarkItDown extracts
      text from the PDF's text layer — if there's no text layer (a scanned
      image), it produces empty or poor results. The `markitdown-ocr`
      plugin exists as a fallback — it sends pages to a vision API as
      images — but it's expensive and slow compared to proper OCR. **For
      now, we suggest a separate workflow** using dedicated OCR tools for
      scanned documents before ingesting the results into Ariadne. Phase 2
      adds a second extraction engine with proper OCR + ML layout detection
      behind a smart router that probes PDF text layers to decide which
      engine handles each document. This enhanced extraction is planned for
      **Managed and Team editions**; Personal edition remains MarkItDown-
      only. Other Phase 1 limitations: legacy Office formats (.doc, .ppt),
      complex table layouts with merged cells, and BMP/TIFF/HEIC images.
    see_also: [format_coverage, the_extraction_pipeline, markitdown_standalone, vision_and_image_handling]
