# config/ariadne.yaml — Ariadne Core configuration
# Uses ${VAR} interpolation from environment variables

# --- Database ---
database:
  url: ${DATABASE_URL:-postgresql://app:${DB_PASSWORD}@localhost:5432/pipeline}

# --- Vector Store ---
vector_store:
  backend: pgvector

# --- Embedding ---
embedding:
  model: ${EMBEDDING_MODEL:-gemini-embedding-001}
  dimensions: 1536
  provider: google-gemini
  base_url: ${EMBEDDING_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
  api_key: ${EMBEDDING_API_KEY}

# --- Image Enrichment (Vision) ---
image_enrichment:
  enabled: true
  provider: google-gemini
  base_url: ${VISION_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
  model: ${VISION_MODEL:-gemini-2.0-flash}
  api_key: ${VISION_API_KEY}
  prompt: "Describe this image in detail. Include any text, data, charts, diagrams, or visual elements. Be specific about numbers, labels, and relationships shown."

# --- MarkItDown ---
markitdown:
  enable_plugins: true

# --- Ingest ---
ingest:
  # Per-source cap (bytes) enforced before/during fetch by
  # services._read_source_bytes. URL fetches fast-fail on Content-Length
  # when the header is honest; otherwise the chunked-read accumulator
  # catches the overrun (worst case ~1 MB slack at 100 MB cap). Local
  # files are size-checked via Path.stat() before read_bytes().
  max_source_bytes: 104857600  # 100 MB

# --- Chunking ---
chunking:
  # "auto" triggers per-file-type strategy selection (.pptx → by_page,
  # .csv/.xlsx → fixed_size, headingless .txt/.log → fixed_size with
  # overlap=400). Explicit values (by_title, by_page, fixed_size) force
  # the strategy regardless of file type.
  strategy: auto
  max_characters: 1500
  new_after_n_chars: 1000
  overlap: 200
  combine_under_n_chars: 200
  # Floor below which chunks are coalesced into a neighbor (by_title strategy).
  min_chunk_tokens: 50

# --- API Server ---
api:
  host: 0.0.0.0
  port: 8000
  mcp_port: 8081

# --- Paths ---
paths:
  incoming: ./data/incoming
  processed: ./data/processed
  temp: ./data/temp

# --- Logging ---
logging:
  level: info
  format: json
